[package]
name = "ckaew-sentinel-ai"
version = "0.2.0"
edition = "2021"

[dependencies]
actix-web = "4.4.0"
serde = { version = "1.0.195", features = ["derive"] }
serde_json = "1.0.111"
tokio = { version = "1.35.1", features = ["full"] }
dotenv = "0.15.0"
env_logger = "0.10.0"
log = "0.4.20"
chrono = "0.4.31"
bcrypt = "0.15.1"
jsonwebtoken = "9.3.1"
sqlx = { version = "0.7.4", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "migrate"] }
