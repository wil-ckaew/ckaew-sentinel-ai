global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'backend'
    static_configs:
      - targets: ['sentinel-backend:8080']
    metrics_path: '/metrics'

  - job_name: 'ai-service'
    static_configs:
      - targets: ['sentinel-ai:8000']
    metrics_path: '/metrics'

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
