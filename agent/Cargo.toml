[package]
name = "ckaew-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
# HTTP Client
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }

# Serialização
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# Configuração
config = "0.14"
dotenv = "0.15"
toml = "0.8"

# Sistema
sysinfo = "0.30"
whoami = "1.5"
hostname = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Processamento
regex = "1"
glob = "0.3"

# Utilitários
anyhow = "1"
thiserror = "1"
local-ip-address = "0.6"

# Linux específico (opcional)
[target.'cfg(target_os = "linux")'.dependencies]
nix = "0.28"

# Windows específico (opcional)
[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winerror", "winbase"] }

[dev-dependencies]
tokio-test = "0.4"
