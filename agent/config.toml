# Configuração do agente CKAEW Sentinel AI.
# A credencial é fornecida exclusivamente pelo ambiente:
# AGENT_INGEST_TOKEN

server_url = "http://127.0.0.1:8080"

collect_interval_secs = 30
report_interval_secs = 60

log_paths = [
    "/var/log/auth.log",
    "/var/log/syslog"
]

max_log_size = 10485760
